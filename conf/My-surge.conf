Apple = select, DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点", icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Apple_Arcade.png
TestFlight = select, "🇺🇸 美国节点", Proxy, DIRECT, "🇯🇵 日本节点", "🇭🇰 香港节点"
Google = select, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点", icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Google.png
Instagram = select, "🇭🇰 香港节点", "🇨🇳 台湾节点", "🇯🇵 日本节点", "🇸🇬 新加坡节点", "🇺🇸 美国节点", no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Instagram-01.png
X = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Google, icon-url=https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/X-01.png
Telegram = select, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点", 实验性, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Telegram.png, no-alert=0, hidden=0, include-all-proxies=0
Spotify = select, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"
YouTube = select, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"
TikTok = select, Proxy, "🇺🇸 美国节点", "🇯🇵 日本节点", "🇸🇬 新加坡节点", "🇨🇳 台湾节点"
BiliBili = select, DIRECT, "🇭🇰 香港节点", "🇨🇳 台湾节点", icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Bilibili.png
Emby = select, Proxy, 实验性, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Emby-01.png
Porn = select, 实验性, Proxy, "🇺🇸 美国节点", "🇯🇵 日本节点", "🇸🇬 新加坡节点"


Microsoft = select, DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点", icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Windows.png

Game = select, DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点", icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Game.png

🇭🇰 香港节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Hong_Kong.png

🇺🇸 美国节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-United_States.png

US-hight = fallback, policy-regex-filter=高级, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=🇺🇸 美国节点, icon-url=https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/Flag/Liberia.png

🇯🇵 日本节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Japan.png
🇨🇳 台湾节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-China.png
🇰🇷 韩国节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇰🇷)|(韩国)|(Korea)|(\bKR), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-South_Korea.png
🇸🇬 新加坡节点 = smart, include-other-group=✈️ 我的节点, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Singapore.png
实验性 = url-test, policy-regex-filter=实验性, no-alert=0, hidden=0, include-all-proxies=0, include-other-group="✈️ 我的节点", icon-url=https://raw.githubusercontent.com/Orz-3/mini/master/Alpha/Flower.png
✈️ 我的节点 = select, policy-path="你机场的地址"

[Rule]
# 广告、追踪及恶意请求拦截；钓鱼扩展列表保持关闭。
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_phishing.conf,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching

# 局域网及必须直连的服务
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT

# 自定义站点：Emby 直连规则优先于 Emby 代理规则
RULE-SET,https://raw.githubusercontent.com/YuKong79A/Surge-rule/main/rules/direct-emby.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/YuKong79A/Surge-rule/main/rules/proxy-emby.list,Emby
RULE-SET,https://raw.githubusercontent.com/YuKong79A/Surge-rule/main/rules/porn-rules.list,Porn

# 专项服务：优先于通用规则；混合列表加 no-resolve，避免其 IP 条目提前触发 DNS。
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,AIGC
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,AIGC,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TestFlight/TestFlight.list,TestFlight
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Instagram/Instagram.list,Instagram
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list,X,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,Spotify,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,YouTube,no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/TikTok/TikTok.list,TikTok
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,no-resolve
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Telegram

# Apple 与 Microsoft 的中国大陆服务及 CDN
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT

# 通用静态 CDN
