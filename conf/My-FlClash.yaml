# FlClash / Mihomo profile from My-surge.conf and SukkaW/Surge README.
# Replace proxy-providers.airport.url with your own Mihomo/Clash node subscription URL.
# Surge MITM and URL-REGEX rules have no direct Mihomo equivalent.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - '*.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.microsoft.com
  - '*.xboxlive.com'
  - '*.battlenet.com.cn'
  - '*.battlenet.com'
  - '*.blzstatic.cn'
  - '*.battle.net'
  - '*.turn.twilio.com'
  - '*.stun.twilio.com'
  - stun.syncthing.net
  - stun.*
  - 127.*.*.*.sslip.io
  - 127-*-*-*.sslip.io
  - '*.127.*.*.*.sslip.io'
  - '*-127-*-*-*.sslip.io'
  - 127.*.*.*.nip.io
  - 127-*-*-*.nip.io
  - '*.127.*.*.*.nip.io'
  - '*-127-*-*-*.nip.io'
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
proxy-providers:
  airport:
    type: http
    url: https://example.com/REPLACE_WITH_YOUR_MIHOMO_NODE_SUBSCRIPTION
    path: ./providers/airport.yaml
    interval: 43200
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
